name: Five Models 89-night PDCA Tournament

on:
  push:
    branches:
      - agent/full-data-baseline-refresh-data
    paths:
      - 'scripts/run_five_models_89night_pdca.py'
      - 'scripts/run_five_models_89night_pdca_fast.py'
      - '.github/workflows/five-models-89night-pdca.yml'
      - 'data/**'
      - 'src/**'
  workflow_dispatch:

concurrency:
  group: five-models-89night-pdca-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -e '.[dev]'
      - name: Run vectorized five-model 89-night PDCA tournament
        run: python scripts/run_five_models_89night_pdca_fast.py
      - name: Validate output and privacy
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('reports/five_models_89night_pdca_summary.json')
          x=json.loads(p.read_text(encoding='utf-8'))
          assert x['status']=='ok'
          assert x['field_evidence_nights_total']==89
          assert x['protocol']['models']==['hierarchical_rank','mixture_experts','graph_time','hawkes_st','conformal_ensemble']
          assert x['protocol']['common_final_zone_m']==250
          assert x['protocol']['prediction_counts']==[30,50,100]
          assert x['protocol']['distance_m']==[50,100,250]
          assert x['protocol']['time_windows_min']==[10,20,30]
          text=p.read_text(encoding='utf-8').lower()
          for forbidden in ['latitude','longitude','road_name','segment_id','zone_id']:
              assert forbidden not in text
          print('five-model 89-night PDCA validation passed')
          PY
      - name: Commit aggregate report
        run: |
          git config user.name 'habuAI-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add reports/five_models_89night_pdca_summary.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: add five-model 89-night PDCA tournament'
            git pull --rebase origin agent/full-data-baseline-refresh-data
            git push
          fi
