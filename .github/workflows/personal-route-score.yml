name: Personal Route Score Validation

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/run_personal_route_score_backtest.py'
      - '.github/workflows/personal-route-score.yml'
      - 'reports/original40_full_history_summary.json'

permissions:
  contents: write

concurrency:
  group: personal-route-score
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -e '.[dev]'
      - name: Run owner-private route score backtest
        run: python scripts/run_personal_route_score_backtest.py
      - name: Privacy gate
        run: |
          python - <<'PY'
          import pandas as pd
          p='reports/personal_route_score_predictions_private_ids.csv'
          d=pd.read_csv(p)
          banned={'segment_id','lat','lon','latitude','longitude','road_name','name'}
          found=banned.intersection(set(d.columns))
          assert not found, f'private location leak columns: {sorted(found)}'
          print('privacy gate passed')
          PY
      - name: Commit reports
        run: |
          git config user.name 'habuAI-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add reports/personal_route_score_summary.json reports/personal_route_score_predictions_private_ids.csv
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh private personal route score validation'
            git pull --rebase origin agent/full-data-baseline-refresh-data
            git push
          fi
