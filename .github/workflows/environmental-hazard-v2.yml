name: Environmental Hazard V2 Validation

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/run_environmental_hazard_v2.py'
      - '.github/workflows/environmental-hazard-v2.yml'

permissions:
  contents: write

concurrency:
  group: environmental-hazard-v2-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -e '.[dev]'
      - name: Run enriched environmental hazard
        run: python scripts/run_environmental_hazard_v2.py
      - name: Commit report
        run: |
          git config user.name 'habuAI-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add reports data/processed/cache || true
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh environmental hazard v2 validation'
            git push
          fi
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: environmental-hazard-v2
          path: reports
