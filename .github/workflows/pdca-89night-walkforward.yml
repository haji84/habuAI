name: 89-night PDCA Walk-forward Validation

on:
  push:
    branches: [agent/full-data-baseline-refresh-data]
    paths:
      - 'scripts/run_89night_pdca_walkforward.py'
      - '.github/workflows/pdca-89night-walkforward.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pdca-89night-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -e '.[dev]'
      - name: Run 89-night PDCA walk-forward
        run: python scripts/run_89night_pdca_walkforward.py
      - name: Validate output and privacy
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('reports/pdca_89night_walkforward_summary.json')
          x=json.loads(p.read_text(encoding='utf-8'))
          assert x['status']=='ok'
          assert x['field_evidence_nights_total']==89
          assert x['count_scored_nights']==77
          text=p.read_text(encoding='utf-8').lower()
          for forbidden in ['latitude','longitude','road_name','segment_id','zone_id','hotspot_id']:
              assert forbidden not in text
          print('89-night PDCA validation passed')
          PY
      - name: Commit aggregate report
        run: |
          git config user.name 'habuAI-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add reports/pdca_89night_walkforward_summary.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: add 89-night PDCA walk-forward validation'
            git pull --rebase origin agent/full-data-baseline-refresh-data
            git push
          fi
