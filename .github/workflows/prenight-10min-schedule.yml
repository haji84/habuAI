name: Pre-night 10-minute Schedule Validation

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/run_prenight_10min_schedule_backtest.py'
      - '.github/workflows/prenight-10min-schedule.yml'

permissions:
  contents: write

concurrency:
  group: prenight-10min-schedule
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -e '.[dev]'
      - name: Run pre-night schedule backtest
        run: python scripts/run_prenight_10min_schedule_backtest.py
      - name: Validate outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('reports/prenight_10min_schedule_backtest_summary.json')
          x=json.loads(p.read_text(encoding='utf-8'))
          assert x['status']=='ok'
          assert x['protocol']['slot_minutes']==10
          assert x['protocol']['prediction_counts']==[10,20,30,50,100,200]
          assert 'target' in x
          print('pre-night schedule validation passed')
          PY
      - name: Commit reports
        run: |
          git config user.name 'habuAI-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add reports/prenight_10min_schedule_backtest_summary.json reports/prenight_10min_schedule_public_audit.csv
          if ! git diff --cached --quiet; then
            git commit -m 'data: add pre-night 10-minute schedule validation'
            git pull --rebase origin agent/full-data-baseline-refresh-data
            git push
          fi
