name: Habu AI v2 Data Requirements Audit

on:
  push:
    branches:
      - agent/full-data-baseline-refresh-data
    paths:
      - 'scripts/run_v2_data_requirements_audit.py'
      - '.github/workflows/v2-data-requirements-audit.yml'
      - 'data/canonical/**'
      - 'reports/canonical_master_audit.json'
      - 'reports/hurdle_count_fast_summary.json'
      - 'reports/zone_models_89night_pdca_summary.json'
      - 'reports/five_models_89night_pdca_summary.json'
      - 'reports/historical_route_reconstruction.json'
  workflow_dispatch:

concurrency:
  group: v2-data-requirements-audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -e '.[dev]'
      - name: Run v2 data requirements audit
        run: python scripts/run_v2_data_requirements_audit.py
      - name: Validate aggregate privacy-safe audit
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('reports/v2_data_requirements_audit.json')
          x=json.loads(p.read_text(encoding='utf-8'))
          assert x['status']=='ok'
          assert x['canonical_capture_rows']==206
          assert x['core_counts']['capture_events']==206
          assert x['field_evidence_nights']==89
          assert x['bottleneck_conclusion']['cannot_claim_90pct_possible_from_current_data'] is True
          text=p.read_text(encoding='utf-8').lower()
          for forbidden in ['road_name','hotspot_rankings']:
              assert forbidden not in text
          print('v2 data requirements audit validation passed')
          PY
      - name: Commit audit report
        run: |
          git config user.name 'habuAI-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add reports/v2_data_requirements_audit.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: add Habu AI v2 data requirements audit'
            git pull --rebase origin agent/full-data-baseline-refresh-data
            git push
          fi
