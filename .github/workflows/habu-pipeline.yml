name: Habu Pipeline

on:
  workflow_dispatch:
  push:
    paths:
      - 'data/raw/**'
      - 'config/**'
      - 'src/**'
      - 'scripts/**'
      - '.github/workflows/habu-pipeline.yml'
  schedule:
    - cron: '20 18 * * *' # 03:20 JST

permissions:
  contents: write

concurrency:
  group: habu-pipeline
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install system GIS tools
        run: |
          sudo apt-get update
          sudo apt-get install -y osmium-tool gdal-bin unzip xz-utils

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python dependencies
        run: pip install -e '.[dev]'

      - name: Import zipped GPX/log bundles
        run: bash scripts/import_raw_bundles.sh

      - name: Recover 2026-09-04 canonical GPX
        if: ${{ hashFiles('staging/retrain-2026-09-04/part_*.b64') != '' }}
        run: bash scripts/recover_retrain_2026_09_04.sh

      - name: Validate raw inputs
        run: |
          GPX_COUNT=$(find data/raw/gpx -maxdepth 1 -type f -name '*.gpx' | wc -l)
          LOG_COUNT=$(find data/raw/logs -maxdepth 1 -type f -name '*.txt' | wc -l)
          echo "GPX_COUNT=$GPX_COUNT LOG_COUNT=$LOG_COUNT"
          if [ "$GPX_COUNT" -eq 0 ]; then
            echo 'No GPX input found. Upload a zip bundle under data/raw/import/ or validated .gpx.xz under data/raw/compressed_gpx/.'
            exit 2
          fi
          if [ "$LOG_COUNT" -eq 0 ]; then
            echo 'No field log found under data/raw/logs/.'
            exit 2
          fi

      - name: Check canonical ACTUAL_GPX inventory
        id: inventory
        shell: bash
        run: |
          python scripts/check_canonical_gpx_inventory.py | tee /tmp/canonical-gpx-inventory.log
          if grep -q '^CANONICAL_GPX_COMPLETE=true$' /tmp/canonical-gpx-inventory.log; then
            echo 'complete=true' >> "$GITHUB_OUTPUT"
          else
            echo 'complete=false' >> "$GITHUB_OUTPUT"
            echo 'WARNING: canonical ACTUAL_GPX inventory is incomplete. Pipeline may run for diagnostics, but generated model/report outputs will not be pushed as canonical latest.'
          fi

      - name: Cache Kyushu OSM PBF
        uses: actions/cache@v4
        with:
          path: data/cache/kyushu-latest.osm.pbf
          key: kyushu-osm-${{ github.run_id }}
          restore-keys: |
            kyushu-osm-

      - name: Build/update Setouchi OSM extract
        run: bash scripts/fetch_osm.sh

      - name: Run full learning pipeline
        run: python scripts/run_pipeline.py

      - name: Run tests
        run: pytest -q

      - name: Commit generated outputs
        if: steps.inventory.outputs.complete == 'true'
        run: |
          git config user.name 'habuAI-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/processed docs reports models || true
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh Habu learning outputs'
            git push
          fi

      - name: Explain withheld canonical publish
        if: steps.inventory.outputs.complete != 'true'
        run: |
          echo 'Canonical publish withheld because one or more expected ACTUAL_GPX originals are missing.'
          cat reports/v2_actual_gpx_pipeline_inventory_status.json || true

      - name: Upload pipeline artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: habu-pipeline-output
          if-no-files-found: warn
          path: |
            data/processed
            reports
            models
            docs
