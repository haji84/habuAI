name: Habu Pipeline

on:
  workflow_dispatch:
  push:
    paths:
      - 'data/raw/**'
      - 'data/canonical/**'
      - 'config/**'
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/habu-pipeline.yml'
  schedule:
    - cron: '20 18 * * *' # 03:20 JST

permissions:
  contents: write

concurrency:
  group: habu-pipeline
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install system GIS tools
        run: |
          sudo apt-get update
          sudo apt-get install -y osmium-tool gdal-bin unzip

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python dependencies
        run: pip install -e '.[dev]'

      - name: Import zipped GPX/log bundles
        run: bash scripts/import_raw_bundles.sh

      - name: Validate raw inputs
        run: |
          GPX_COUNT=$(find data/raw/gpx -maxdepth 1 -type f -name '*.gpx' | wc -l)
          LOG_COUNT=$(find data/raw/logs -maxdepth 1 -type f -name '*.txt' | wc -l)
          CANONICAL_COUNT=$(find data/canonical -maxdepth 1 -type f -name 'habu_capture_master_part_*.csv' | wc -l)
          echo "GPX_COUNT=$GPX_COUNT LOG_COUNT=$LOG_COUNT CANONICAL_COUNT=$CANONICAL_COUNT"
          test "$GPX_COUNT" -gt 0
          test "$LOG_COUNT" -gt 0
          test "$CANONICAL_COUNT" -gt 0

      - name: Cache Kyushu OSM PBF
        uses: actions/cache@v4
        with:
          path: data/cache/kyushu-latest.osm.pbf
          key: kyushu-osm-${{ github.run_id }}
          restore-keys: |
            kyushu-osm-

      - name: Build/update Setouchi OSM extract
        run: bash scripts/fetch_osm.sh

      - name: Run full learning pipeline
        run: python scripts/run_pipeline.py

      - name: Run historical spatial ablation
        run: python scripts/run_spatial_ablation.py

      - name: Run spatial and temporal model tournament
        run: python scripts/run_model_tournament.py

      - name: Run tests
        run: pytest -q

      - name: Commit generated outputs
        run: |
          git config user.name 'habuAI-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/processed docs reports models || true
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh Habu learning outputs'
            git push
          fi

      - name: Upload pipeline artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: habu-pipeline-output
          if-no-files-found: warn
          path: |
            data/processed
            reports
            models
            docs
