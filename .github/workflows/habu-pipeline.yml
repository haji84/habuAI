name: Habu Pipeline

on:
  workflow_dispatch:
  push:
    paths:
      - 'data/raw/**'
      - 'config/**'
      - 'src/**'
      - 'scripts/**'
      - '.github/workflows/habu-pipeline.yml'
  schedule:
    - cron: '20 18 * * *' # 03:20 JST

permissions:
  contents: write

concurrency:
  group: habu-pipeline
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install system GIS tools
        run: |
          sudo apt-get update
          sudo apt-get install -y osmium-tool gdal-bin

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python dependencies
        run: pip install -e .

      - name: Cache Kyushu OSM PBF
        uses: actions/cache@v4
        with:
          path: data/cache/kyushu-latest.osm.pbf
          key: kyushu-osm-${{ github.run_id }}
          restore-keys: |
            kyushu-osm-

      - name: Build/update Setouchi OSM extract
        run: bash scripts/fetch_osm.sh

      - name: Run full learning pipeline
        run: python scripts/run_pipeline.py

      - name: Run tests
        run: pytest -q

      - name: Commit generated outputs
        run: |
          git config user.name 'habuAI-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/processed docs reports models || true
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh Habu learning outputs'
            git push
          fi

      - name: Upload pipeline artifact
        uses: actions/upload-artifact@v4
        with:
          name: habu-pipeline-output
          path: |
            data/processed
            reports
            models
            docs
