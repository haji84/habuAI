name: Seasonal Memory Strategy Backtest

on:
  push:
    paths:
      - 'scripts/run_seasonal_memory_backtest.py'
      - '.github/workflows/seasonal-memory-backtest.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -e '.[dev]'
      - name: Run seasonal memory backtest
        run: python scripts/run_seasonal_memory_backtest.py
      - name: Commit reports
        run: |
          git config user.name 'habuAI-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add reports data/processed/cache || true
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh seasonal memory validation'
            git pull --rebase origin agent/full-data-baseline-refresh-data
            git push
          fi
