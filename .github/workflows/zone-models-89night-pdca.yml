name: 89-night Zone Models PDCA Validation

on:
  push:
    branches:
      - agent/full-data-baseline-refresh-data
    paths:
      - 'scripts/run_zone_models_89night_pdca.py'
      - '.github/workflows/zone-models-89night-pdca.yml'
      - 'data/**'
      - 'src/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -e '.[dev]'
      - name: Run 89-night zone-model PDCA
        run: python scripts/run_zone_models_89night_pdca.py
      - name: Validate aggregate output and privacy
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('reports/zone_models_89night_pdca_summary.json')
          x=json.loads(p.read_text(encoding='utf-8'))
          assert x['status']=='ok'
          assert x['field_evidence_nights_total']==89
          assert x['protocol']['schemes']==['segment','zone100','zone250','zone500','zone1000']
          assert x['protocol']['prediction_counts']==[30,50,100]
          assert x['protocol']['distance_m']==[50,100,250]
          assert x['protocol']['time_windows_min']==[10,20,30]
          text=p.read_text(encoding='utf-8').lower()
          for forbidden in ['latitude','longitude','road_name','segment_id','zone_id']:
              assert forbidden not in text
          print('89-night zone-model PDCA validation passed')
          PY
      - name: Commit aggregate report
        run: |
          git config user.name 'habuAI-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add reports/zone_models_89night_pdca_summary.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: add 89-night zone-model PDCA validation'
            git pull --rebase origin agent/full-data-baseline-refresh-data
            git push
          fi
