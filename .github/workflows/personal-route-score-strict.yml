name: Personal Route Score Strict Validation

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/run_personal_route_score_strict.py'
      - '.github/workflows/personal-route-score-strict.yml'

permissions:
  contents: write

concurrency:
  group: personal-route-score-strict
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -e '.[dev]'
      - name: Run strict route score backtest
        run: python scripts/run_personal_route_score_strict.py
      - name: Privacy gate
        run: |
          python - <<'PY'
          import json
          p='reports/personal_route_score_strict_summary.json'
          x=json.load(open(p,encoding='utf-8'))
          banned={'lat','lon','latitude','longitude','road_name','segment_id'}
          leaks=[]
          def walk(v,path='root'):
              if isinstance(v,dict):
                  for k,val in v.items():
                      if str(k).lower() in banned:
                          leaks.append(f'{path}.{k}')
                      walk(val,f'{path}.{k}')
              elif isinstance(v,list):
                  for i,val in enumerate(v):
                      walk(val,f'{path}[{i}]')
          walk(x)
          if leaks:
              raise SystemExit('privacy leak keys: '+','.join(leaks))
          print('privacy gate passed: no raw location identifier keys')
          PY
      - name: Commit report
        run: |
          git config user.name 'habuAI-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add reports/personal_route_score_strict_summary.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: add strict personal route score validation'
            git pull --rebase origin agent/full-data-baseline-refresh-data
            git push
          fi
