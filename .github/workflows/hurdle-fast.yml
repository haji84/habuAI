name: Fast Habu Hurdle Validation

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/run_hurdle_count_fast.py'
      - '.github/workflows/hurdle-fast.yml'

permissions:
  contents: write

jobs:
  hurdle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -e '.[dev]'
      - run: python scripts/run_hurdle_count_fast.py
      - name: Commit report
        run: |
          git config user.name 'habuAI-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add reports/hurdle_count_fast_summary.json reports/hurdle_count_fast_predictions.csv
          if ! git diff --cached --quiet; then
            git commit -m 'data: persist fast Habu hurdle validation'
            git push
          fi
