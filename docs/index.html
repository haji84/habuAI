<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>habuAI</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>html,body,#map{height:100%;margin:0}#p{position:absolute;z-index:999;background:white;padding:8px;top:8px;right:8px;border-radius:8px}</style><div id="map"></div><div id="p"><b>habuAI 瀬戸内町 10m risk</b><br>OSM 10m × 探索量補正</div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const m=L.map('map').setView([28.17,129.36],12);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:20,attribution:'© OpenStreetMap contributors'}).addTo(m);Promise.all([fetch('data/segments.geojson').then(r=>r.json()),fetch('data/events.geojson').then(r=>r.ok?r.json():null),fetch('data/latest_route.geojson').then(r=>r.ok?r.json():null)]).then(([s,e,r])=>{const a=L.geoJSON(s,{style:f=>({color:(f.properties.visits||0)?((f.properties.risk||0)>.04?'#a00':(f.properties.risk||0)>.02?'#f60':'#6a6'):'#aaa',weight:f.properties.unvisited?1:4,opacity:f.properties.unvisited?.25:.8}),onEachFeature:(f,l)=>l.bindPopup(`ID ${f.properties.segment_id}<br>通過 ${f.properties.visits}<br>捕獲 ${f.properties.captures}<br>risk ${(f.properties.risk||0).toFixed(4)}`)}).addTo(m);const o={'10m risk':a};if(e)o.events=L.geoJSON(e,{pointToLayer:(f,ll)=>L.circleMarker(ll,{radius:f.properties.species==='ハブ'?(f.properties.is_large_habu?8:6):3,fillOpacity:.75})}).addTo(m);if(r)o['latest GPX']=L.geoJSON(r,{style:{weight:4}}).addTo(m);L.control.layers(null,o,{collapsed:false}).addTo(m)});</script>
