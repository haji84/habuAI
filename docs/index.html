<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>habuAI Map</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>html,body,#map{height:100%;margin:0}.panel{position:absolute;z-index:999;background:white;padding:8px;top:10px;right:10px;border-radius:8px}</style></head><body><div id="map"></div><div class="panel">habuAI 10m risk map</div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const map=L.map('map').setView([28.17,129.36],12);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:20,attribution:'© OpenStreetMap'}).addTo(map);function color(r){return r>.2?'#7f0000':r>.1?'#d7301f':r>.05?'#fc8d59':r>.02?'#fdcc8a':'#d9f0a3'}fetch('data/segments.geojson').then(r=>r.json()).then(g=>L.geoJSON(g,{style:f=>({color:color(f.properties.risk||0),weight:4,opacity:.8}),onEachFeature:(f,l)=>l.bindPopup(`segment: ${f.properties.segment_id}<br>visits: ${f.properties.visits}<br>captures: ${f.properties.captures}<br>risk: ${(f.properties.risk||0).toFixed(3)}`)}).addTo(map));fetch('data/events.geojson').then(r=>r.ok?r.json():null).then(g=>{if(g)L.geoJSON(g,{pointToLayer:(f,ll)=>L.circleMarker(ll,{radius:f.properties.species==='ハブ'?6:3})}).addTo(map)});</script></body></html>
